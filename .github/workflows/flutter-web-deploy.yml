name: Build and Deploy Flutter Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  DEPLOY_BRANCH: deploy
  OUTPUT_DIR: web-build
  DOCS_DIR: docs
  REPO_NAME: flutter_web_github_pages_deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout main branch
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set BASE_HREF dynamically
      - name: Set BASE_HREF
        run: echo "BASE_HREF=/${{ env.REPO_NAME }}/" >> $GITHUB_ENV

      # 3. Setup Flutter (3.41.9 includes Dart 3.11.5)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      # 4. Install dependencies
      - name: Install Flutter dependencies
        run: flutter pub get

      # 5. Bump build number for CI
      - name: Bump build number
        id: version
        run: |
          current_version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          version_name="${current_version%%+*}"
          new_version="${version_name}+${GITHUB_RUN_NUMBER}"
          sed -i -E "s/^version:.*/version: ${new_version}/" pubspec.yaml
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "Using version: ${new_version}"

      # 6. Build Flutter web with dynamic BASE_HREF
      - name: Build Flutter Web (release)
        run: |
          flutter build web \
            --release \
            --base-href "${BASE_HREF}" \
            --build-number "${GITHUB_RUN_NUMBER}"
          rm -rf "${OUTPUT_DIR}"
          mkdir -p "${OUTPUT_DIR}"
          rsync -a --delete build/web/ "${OUTPUT_DIR}/"

      # 7. Setup 404.html for SPA
      - name: Setup 404.html for SPA
        run: |
          cat > "${OUTPUT_DIR}/404.html" <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Flutter Web</title>
            <script>
              (function () {
                var redirect = sessionStorage.redirect;
                delete sessionStorage.redirect;
                if (redirect && redirect !== location.href) {
                  history.replaceState(null, "", redirect);
                }
              })();
            </script>
          </head>
          <body></body>
          </html>
          EOF

      # 8. Checkout or create deploy branch (with stash fix)
      - name: Checkout deploy branch
        run: |
          # Stash any local changes
          git stash --include-untracked

          # Fetch deploy branch
          git fetch origin "${DEPLOY_BRANCH}" || echo "Deploy branch does not exist yet"

          # Checkout deploy branch if exists, otherwise create orphan
          if git rev-parse --verify origin/${DEPLOY_BRANCH}; then
            git checkout ${DEPLOY_BRANCH}
          else
            git checkout --orphan ${DEPLOY_BRANCH}
            git reset --hard
          fi

      # 9. Sync web build to docs/
      - name: Sync web build to docs/
        run: |
          rm -rf "${DOCS_DIR}"
          mkdir -p "${DOCS_DIR}"
          rsync -a --delete "${OUTPUT_DIR}/" "${DOCS_DIR}/"

      # 10. Commit and push deploy branch
      - name: Commit and push deploy branch
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to deploy."
            exit 0
          fi

          git add "${DOCS_DIR}/"
          git commit -m "chore(deploy): Flutter web build ${GITHUB_SHA::7} (run #${GITHUB_RUN_NUMBER}, version ${{ steps.version.outputs.new_version }})"
          git push origin "${DEPLOY_BRANCH}"
